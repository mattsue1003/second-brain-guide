<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root{--bg:#F4F5FA;--card:#FFFFFF;--ink:#1B2030;--muted:#5F6780;--line:#D9DDEA;--accent:#2F45C5;--soft:#E6EAFB;--warn:#A34708}
  @media (prefers-color-scheme: dark){:root{--bg:#10131C;--card:#191D2A;--ink:#E6E9F5;--muted:#9AA2BC;--line:#2C3247;--accent:#8C9BFF;--soft:#232A4A;--warn:#F2B36B;color-scheme:dark}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px;line-height:1.65}
  .wrap{max-width:820px;margin:0 auto;padding:18px 16px 60px;display:flex;flex-direction:column;gap:14px}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem;margin:0}
  button,input,textarea,select{font:inherit}
  input,textarea,select{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 12px}
  textarea{min-height:110px;resize:vertical}
  .btn{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer}
  @media (prefers-color-scheme: dark){.btn{color:#0C1024}}
  .btn.sec{background:var(--soft);color:var(--ink)}
  .btn:disabled{opacity:.5;cursor:wait}
  .tabs{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:12px}
  .tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:8px 4px;border-radius:9px;font-weight:700;cursor:pointer}
  .tabs button[aria-selected="true"]{background:var(--card);color:var(--ink)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .row > input{flex:1;min-width:160px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:2px 11px;font-size:.85rem;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .note{border-top:1px solid var(--line);padding:10px 0;display:grid;grid-template-columns:26px 1fr;gap:8px}
  .note:first-child{border-top:0}
  .note input{width:20px;height:20px;margin-top:4px;accent-color:var(--accent)}
  .note h3{margin:0;font-size:1rem;cursor:pointer}
  .note h3:hover{color:var(--accent)}
  .meta{color:var(--muted);font-size:.8rem}
  .note p{margin:2px 0 0;font-size:.92rem}
  .tag{color:var(--accent);font-size:.8rem;margin-right:6px}
  .out{white-space:pre-wrap;background:var(--soft);border-radius:10px;padding:12px 14px}
  .err{color:var(--warn);font-weight:700}
  .hide{display:none}
  .pickbar{position:sticky;bottom:10px;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .pickbar button{border:0;border-radius:8px;padding:6px 14px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>我的第二大腦</h1>
    <p class="sub" id="stat">請先輸入密碼</p>
  </div>

  <div class="card" id="gate">
    <label for="pw">密碼（設定.gs 裡的 WEB_PASSWORD）</label>
    <div class="row"><input id="pw" type="password" autocomplete="current-password"><button class="btn" id="pwBtn">進入</button></div>
    <span class="err" id="pwErr"></span>
  </div>

  <div id="app" class="hide" style="display:none;flex-direction:column;gap:14px">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="search" aria-selected="true">搜尋</button>
      <button role="tab" data-tab="ask" aria-selected="false">問我</button>
      <button role="tab" data-tab="compose" aria-selected="false">產出</button>
      <button role="tab" data-tab="add" aria-selected="false">新增</button>
    </div>

    <section data-pane="search" style="display:flex;flex-direction:column;gap:14px">
      <div class="card">
        <div class="row"><input id="q" placeholder="輸入關鍵字，例如：手部 精細動作"><button class="btn" id="qBtn">搜尋</button></div>
        <div class="chips" id="cats"></div>
        <div class="chips" id="tags"></div>
      </div>
      <div class="card"><div class="meta" id="listTitle">最近的筆記</div><div id="list"></div></div>
      <div class="card hide" id="detail"></div>
    </section>

    <section data-pane="ask" class="hide" style="display:none;flex-direction:column;gap:14px">
      <div class="card">
        <label for="askQ">問你的筆記庫一個問題</label>
        <textarea id="askQ" placeholder="例如：我記過哪些適合失智長輩的團體活動？"></textarea>
        <div class="row"><button class="btn" id="askBtn">發問</button><span class="meta">只會根據你自己的筆記回答，並標出來源</span></div>
      </div>
      <div class="card hide" id="askOut"></div>
    </section>

    <section data-pane="compose" class="hide" style="display:none;flex-direction:column;gap:14px">
      <div class="card">
        <div id="pickInfo" class="meta">還沒有勾選筆記。到「搜尋」分頁勾選想用的筆記。</div>
        <label for="kind">要做成什麼</label>
        <select id="kind"></select>
        <label for="extra">補充要求（可不填）</label>
        <input id="extra" placeholder="例如：對象是社區據點的志工">
        <div class="row"><button class="btn" id="composeBtn">產生初稿</button></div>
      </div>
      <div class="card hide" id="composeOut"></div>
    </section>

    <section data-pane="add" class="hide" style="display:none;flex-direction:column;gap:14px">
      <div class="card">
        <label for="addT">貼上文字或網址，AI 會自動下標題、摘要、標籤</label>
        <textarea id="addT"></textarea>
        <div class="row"><button class="btn" id="addBtn">存入</button><span id="addMsg" class="meta"></span></div>
      </div>
    </section>

    <div class="pickbar hide" id="pickbar"><span id="pickCount"></span><span><button id="pickClear">清除</button> <button id="pickGo">拿去產出</button></span></div>
  </div>
</div>

<script>
var PASS = '', HOME = null, picked = {}, filter = { category: '', tag: '' };
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function show(el, on){ el.classList.toggle('hide', !on); el.style.display = on ? 'flex' : 'none'; }

// 呼叫後端。按鈕在等待時會暫停，避免重複送出。
function call(action, arg, btn, done){
  var label;
  if(btn){ label = btn.textContent; btn.disabled = true; btn.textContent = '處理中…'; }
  function finish(res){ if(btn){ btn.disabled = false; btn.textContent = label; } done(res || { error: '沒有收到回應' }); }
  google.script.run.withSuccessHandler(finish).withFailureHandler(function(e){ finish({ error: e.message || String(e) }); }).api(PASS, action, arg || {});
}

function enter(){
  PASS = $('#pw').value;
  call('home', {}, $('#pwBtn'), function(res){
    if(res.error){ $('#pwErr').textContent = res.error; return; }
    try{ sessionStorage.setItem('sb-pass', PASS); }catch(e){}
    show($('#gate'), false); show($('#app'), true);
    renderHome(res);
  });
}
function renderHome(res){
  HOME = res;
  $('#stat').textContent = '共 ' + res.count + ' 則筆記';
  $('#cats').innerHTML = res.categories.map(function(c){ return '<button class="chip" data-cat="'+esc(c.name)+'" aria-pressed="false">'+esc(c.name)+' '+c.count+'</button>'; }).join('');
  $('#tags').innerHTML = res.tags.map(function(t){ return '<button class="chip" data-tag="'+esc(t.name)+'" aria-pressed="false"># '+esc(t.name)+'</button>'; }).join('');
  $('#kind').innerHTML = res.kinds.map(function(k){ return '<option>'+esc(k)+'</option>'; }).join('');
  renderList(res.notes, '最近的筆記');
}
function noteHTML(n){
  return '<div class="note"><input type="checkbox" data-pick="'+n.id+'" aria-label="勾選 #'+n.id+'"'+(picked[n.id]?' checked':'')+'>' +
    '<div><h3 data-open="'+n.id+'">'+esc(n.title)+'</h3><div class="meta">#'+n.id+'｜'+esc(n.date)+'｜'+esc(n.category)+'｜'+esc(n.type)+'</div>' +
    '<p>'+esc(n.summary)+'</p><div>'+n.tags.map(function(t){ return '<span class="tag"># '+esc(t)+'</span>'; }).join('')+'</div></div></div>';
}
function renderList(notes, title){
  notes.forEach(function(n){ renderList.cache[n.id] = n; });
  $('#listTitle').textContent = title;
  $('#list').innerHTML = notes.length ? notes.map(noteHTML).join('') : '<p class="meta">沒有符合的筆記。</p>';
}
renderList.cache = {};
function search(){
  var q = $('#q').value.trim();
  call('search', { q: q, category: filter.category, tag: filter.tag }, $('#qBtn'), function(res){
    if(res.error){ $('#listTitle').textContent = res.error; return; }
    var label = [q && '「'+q+'」', filter.category, filter.tag && '# '+filter.tag].filter(Boolean).join('・');
    renderList(res.notes, (label || '全部') + '：' + res.notes.length + ' 則');
  });
}
function openNote(id){
  var box = $('#detail'); show(box, true); box.innerHTML = '<span class="meta">讀取中…</span>';
  call('note', { id: id }, null, function(res){
    if(res.error || !res.note){ box.innerHTML = '<span class="err">'+esc(res.error || '找不到這則筆記')+'</span>'; return; }
    var n = res.note;
    box.innerHTML = '<h3 style="margin:0">#'+n.id+' '+esc(n.title)+'</h3><div class="meta">'+esc(n.date)+'｜'+esc(n.category)+'｜'+esc(n.type)+'</div>' +
      '<div class="out">'+esc(n.text)+'</div>' + (/^https?:\/\//.test(n.link) ? '<a href="'+esc(n.link)+'" target="_blank" rel="noopener">開啟原始連結或附件</a>' : '') +
      '<div class="meta" id="relTitle"></div><div id="rel"></div>';
    box.scrollIntoView({ block: 'nearest' });
    call('related', { id: id }, null, function(r){
      if(r.notes && r.notes.length){ r.notes.forEach(function(x){ renderList.cache[x.id] = x; }); $('#relTitle').textContent = '相關的筆記'; $('#rel').innerHTML = r.notes.map(noteHTML).join(''); }
    });
  });
}
function updatePicks(){
  var ids = Object.keys(picked);
  show($('#pickbar'), ids.length > 0);
  $('#pickCount').textContent = '已勾選 ' + ids.length + ' 則';
  $('#pickInfo').innerHTML = ids.length ? '要使用的筆記：' + ids.map(function(id){ return '<b>#'+id+'</b> '+esc((renderList.cache[id]||{}).title||''); }).join('、') : '還沒有勾選筆記。到「搜尋」分頁勾選想用的筆記。';
}
function tab(name){
  document.querySelectorAll('[data-tab]').forEach(function(b){ b.setAttribute('aria-selected', String(b.dataset.tab === name)); });
  document.querySelectorAll('[data-pane]').forEach(function(p){ show(p, p.dataset.pane === name); });
}
function copyBtn(text){
  var b = document.createElement('button'); b.className = 'btn sec'; b.textContent = '複製';
  b.onclick = function(){ try{ navigator.clipboard.writeText(text).then(function(){ b.textContent = '已複製'; }); }catch(e){ b.textContent = '請手動選取複製'; } };
  return b;
}

$('#pwBtn').onclick = enter;
$('#pw').addEventListener('keydown', function(e){ if(e.key === 'Enter') enter(); });
$('#qBtn').onclick = search;
$('#q').addEventListener('keydown', function(e){ if(e.key === 'Enter') search(); });
document.querySelector('.tabs').addEventListener('click', function(e){ var b = e.target.closest('[data-tab]'); if(b) tab(b.dataset.tab); });
document.addEventListener('click', function(e){
  var c = e.target.closest('[data-cat]'), t = e.target.closest('[data-tag]'), o = e.target.closest('[data-open]');
  if(c){ filter.category = filter.category === c.dataset.cat ? '' : c.dataset.cat; }
  if(t){ filter.tag = filter.tag === t.dataset.tag ? '' : t.dataset.tag; }
  if(c || t){
    document.querySelectorAll('[data-cat]').forEach(function(x){ x.setAttribute('aria-pressed', String(x.dataset.cat === filter.category)); });
    document.querySelectorAll('[data-tag]').forEach(function(x){ x.setAttribute('aria-pressed', String(x.dataset.tag === filter.tag)); });
    search();
  }
  if(o) openNote(Number(o.dataset.open));
});
document.addEventListener('change', function(e){
  var p = e.target.closest('[data-pick]'); if(!p) return;
  if(p.checked) picked[p.dataset.pick] = true; else delete picked[p.dataset.pick];
  updatePicks();
});
$('#pickClear').onclick = function(){ picked = {}; document.querySelectorAll('[data-pick]').forEach(function(x){ x.checked = false; }); updatePicks(); };
$('#pickGo').onclick = function(){ tab('compose'); };
$('#askBtn').onclick = function(){
  var q = $('#askQ').value.trim(); if(!q) return;
  call('ask', { q: q }, $('#askBtn'), function(res){
    var box = $('#askOut'); show(box, true);
    if(res.error){ box.innerHTML = '<span class="err">'+esc(res.error)+'</span>'; return; }
    box.innerHTML = '<div class="out">'+esc(res.text)+'</div><div class="meta">'+(res.sources.length ? '來源：'+res.sources.map(function(s){ return '<a href="#" data-open="'+s.id+'">#'+s.id+' '+esc(s.title)+'</a>'; }).join('、') : '')+'</div>';
    box.querySelectorAll('[data-open]').forEach(function(a){ a.addEventListener('click', function(ev){ ev.preventDefault(); tab('search'); }); });
  });
};
$('#composeBtn').onclick = function(){
  call('compose', { ids: Object.keys(picked), kind: $('#kind').value, extra: $('#extra').value }, $('#composeBtn'), function(res){
    var box = $('#composeOut'); show(box, true);
    if(res.error){ box.innerHTML = '<span class="err">'+esc(res.error)+'</span>'; return; }
    box.innerHTML = '<div class="meta">'+esc(res.kind)+'｜也已存到試算表的「產出」工作表</div><div class="out">'+esc(res.text)+'</div>';
    box.appendChild(copyBtn(res.text));
  });
};
$('#addBtn').onclick = function(){
  var t = $('#addT').value.trim(); if(!t) return;
  call('add', { text: t }, $('#addBtn'), function(res){
    if(res.error){ $('#addMsg').textContent = res.error; return; }
    $('#addMsg').textContent = '已存入 #' + res.note.id + '【' + res.note.title + '】';
    $('#addT').value = '';
    call('home', {}, null, function(h){ if(!h.error) renderHome(h); });
  });
};
try{ var saved = sessionStorage.getItem('sb-pass'); if(saved){ $('#pw').value = saved; enter(); } }catch(e){}
</script>
</body>
</html>
